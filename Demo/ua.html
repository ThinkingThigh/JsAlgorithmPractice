<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UA 检测</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f5f5f5;
            color: #222;
            padding: 24px;
            font-size: 14px;
        }

        h1 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .ua-box {
            background: #fff;
            border: 1px solid #ddd;
            padding: 12px 14px;
            font-family: monospace;
            font-size: 13px;
            line-height: 1.6;
            word-break: break-all;
            margin-bottom: 20px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }

        .card {
            background: #fff;
            border: 1px solid #ddd;
            padding: 16px;
        }

        .card h2 {
            font-size: 13px;
            font-weight: 600;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid #eee;
        }

        .row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .row:last-child { border-bottom: none; }

        .row-label { color: #666; }
        .row-value { font-weight: 500; text-align: right; }

        .features {
            background: #fff;
            border: 1px solid #ddd;
        }

        .features-header {
            font-size: 13px;
            font-weight: 600;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 14px 16px;
            border-bottom: 1px solid #eee;
        }

        .feature-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        }

        .feature-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 16px;
            border-bottom: 1px solid #f0f0f0;
            border-right: 1px solid #f0f0f0;
        }

        .badge {
            font-size: 11px;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 2px;
        }

        .yes { background: #e6f4ea; color: #1a7f3c; }
        .no  { background: #fce8e6; color: #c5221f; }

        button {
            margin-top: 16px;
            padding: 7px 16px;
            background: #fff;
            border: 1px solid #ccc;
            cursor: pointer;
            font-size: 13px;
        }

        button:hover { background: #f0f0f0; }

        @media (max-width: 600px) {
            body { padding: 14px; }
            .cards { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <h1>UA 检测</h1>

    <div class="ua-box" id="uaBox"></div>

    <div class="cards" id="cards"></div>

    <div class="features">
        <div class="features-header">兼容性</div>
        <div class="feature-grid" id="featureGrid"></div>
    </div>

    <button onclick="run()">重新检测</button>

    <script>
        async function detect() {
            const ua = navigator.userAgent;

            const browser = detectBrowser(ua);
            const os = await detectOS(ua);
            const device = detectDevice(ua);
            const screen_ = {
                resolution: screen.width + ' × ' + screen.height,
                viewport: window.innerWidth + ' × ' + window.innerHeight,
                dpr: window.devicePixelRatio || 1
            };
            const features = detectFeatures();

            return { ua, browser, os, device, screen_, features };
        }

        function detectBrowser(ua) {
            if (ua.includes('Chrome') && !ua.includes('Edg') && !ua.includes('OPR')) {
                return { name: 'Chrome', version: (ua.match(/Chrome\/(\d+)/) || [])[1] || '-', engine: 'Blink' };
            }
            if (ua.includes('Edg')) {
                return { name: 'Edge', version: (ua.match(/Edg\/(\d+)/) || [])[1] || '-', engine: 'Blink' };
            }
            if (ua.includes('Firefox')) {
                return { name: 'Firefox', version: (ua.match(/Firefox\/(\d+)/) || [])[1] || '-', engine: 'Gecko' };
            }
            if (ua.includes('Safari') && !ua.includes('Chrome')) {
                return { name: 'Safari', version: (ua.match(/Version\/(\d+)/) || [])[1] || '-', engine: 'WebKit' };
            }
            if (ua.includes('OPR')) {
                return { name: 'Opera', version: (ua.match(/OPR\/(\d+)/) || [])[1] || '-', engine: 'Blink' };
            }
            if (ua.includes('MSIE') || ua.includes('Trident')) {
                const m = ua.match(/MSIE (\d+)/) || ua.match(/rv:(\d+)/);
                return { name: 'IE', version: m ? m[1] : '-', engine: 'Trident' };
            }
            return { name: '-', version: '-', engine: '-' };
        }

        async function detectOS(ua) {
            if (navigator.userAgentData && navigator.userAgentData.getHighEntropyValues) {
                try {
                    const h = await navigator.userAgentData.getHighEntropyValues(['platform', 'platformVersion']);
                    const p = h.platform;
                    let v = h.platformVersion || '-';
                    if (p === 'Windows') {
                        const major = parseInt(v.split('.')[0]);
                        v = major >= 13 ? '11' : major >= 1 ? '10' : v;
                    }
                    return { name: p || '-', version: v };
                } catch (_) {}
            }
            // UA fallback（版本已被浏览器冻结，仅供参考）
            if (ua.includes('Windows NT 10.0')) return { name: 'Windows', version: '10/11*' };
            if (ua.includes('Windows NT 6.3'))  return { name: 'Windows', version: '8.1' };
            if (ua.includes('Windows NT 6.1'))  return { name: 'Windows', version: '7' };
            if (ua.includes('Mac OS X')) {
                const m = ua.match(/Mac OS X (\d+[._]\d+[._]?\d*)/);
                return { name: 'macOS', version: m ? m[1].replace(/_/g, '.') + '*' : '-' };
            }
            if (ua.includes('Android')) {
                const m = ua.match(/Android (\d+[.\d]*)/);
                return { name: 'Android', version: m ? m[1] : '-' };
            }
            if (ua.includes('iPhone') || ua.includes('iPad')) {
                const m = ua.match(/OS (\d+[_\d]*)/);
                return { name: 'iOS', version: m ? m[1].replace(/_/g, '.') : '-' };
            }
            if (ua.includes('Linux')) return { name: 'Linux', version: '-' };
            return { name: '-', version: '-' };
        }

        function detectDevice(ua) {
            if (ua.includes('Mobile') || (ua.includes('Android') && !ua.includes('Tablet'))) return 'Mobile';
            if (ua.includes('Tablet') || ua.includes('iPad')) return 'Tablet';
            return 'Desktop';
        }

        function detectFeatures() {
            const css = p => p in document.createElement('div').style;
            const es = code => { try { eval(code); return true; } catch { return false; } };
            const webgl = () => { try { const c = document.createElement('canvas'); return !!(c.getContext('webgl') || c.getContext('experimental-webgl')); } catch { return false; } };

            return {
                'Canvas': !!document.createElement('canvas').getContext,
                'Video': !!document.createElement('video').canPlayType,
                'Audio': !!document.createElement('audio').canPlayType,
                'LocalStorage': typeof localStorage !== 'undefined',
                'SessionStorage': typeof sessionStorage !== 'undefined',
                'Geolocation': !!navigator.geolocation,
                'Web Workers': typeof Worker !== 'undefined',
                'CSS Animations': css('animation'),
                'CSS Transitions': css('transition'),
                'CSS Transform': css('transform'),
                'Flexbox': css('flexDirection'),
                'Grid': css('gridTemplateColumns'),
                'ES6 Arrow fn': es('()=>{}'),
                'ES6 Classes': es('class T{}'),
                'ES6 Promise': typeof Promise !== 'undefined',
                'ES6 Map/Set': typeof Map !== 'undefined',
                'ES6 Destructuring': es('const{a}={a:1}'),
                'Async/Await': es('async function f(){await Promise.resolve()}'),
                'Fetch API': typeof fetch !== 'undefined',
                'WebSocket': typeof WebSocket !== 'undefined',
                'IndexedDB': typeof indexedDB !== 'undefined',
                'Service Worker': 'serviceWorker' in navigator,
                'Notifications': 'Notification' in window,
                'WebRTC': !!(navigator.getUserMedia || navigator.mediaDevices),
                'WebGL': webgl(),
                'WebAssembly': typeof WebAssembly !== 'undefined',
                'Media Queries': !!(window.matchMedia),
                'Touch Events': 'ontouchstart' in window || navigator.maxTouchPoints > 0,
                'Performance API': 'performance' in window,
                'Intersection Observer': 'IntersectionObserver' in window,
                'Mutation Observer': 'MutationObserver' in window,
            };
        }

        function row(label, value) {
            return `<div class="row"><span class="row-label">${label}</span><span class="row-value">${value}</span></div>`;
        }

        async function run() {
            const d = await detect();

            document.getElementById('uaBox').textContent = d.ua;

            document.getElementById('cards').innerHTML = `
                <div class="card">
                    <h2>浏览器</h2>
                    ${row('名称', d.browser.name)}
                    ${row('版本', d.browser.version)}
                    ${row('内核', d.browser.engine)}
                </div>
                <div class="card">
                    <h2>系统</h2>
                    ${row('操作系统', d.os.name)}
                    ${row('版本', d.os.version)}
                    ${row('设备类型', d.device)}
                </div>
                <div class="card">
                    <h2>屏幕</h2>
                    ${row('分辨率', d.screen_.resolution)}
                    ${row('视窗', d.screen_.viewport)}
                    ${row('DPR', d.screen_.dpr)}
                </div>
            `;

            const grid = document.getElementById('featureGrid');
            grid.innerHTML = Object.entries(d.features).map(([k, v]) =>
                `<div class="feature-item">
                    <span>${k}</span>
                    <span class="badge ${v ? 'yes' : 'no'}">${v ? '支持' : '不支持'}</span>
                </div>`
            ).join('');
        }

        run();
    </script>
</body>
</html>
